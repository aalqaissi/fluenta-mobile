org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# --- Build without Java daemons/loopback + no incremental Kotlin caches ---
# This machine's loopback proxy blocks fresh Gradle/Kotlin daemon connections, and
# the Kotlin incremental caches corrupt across interrupted builds. Running Gradle
# without its daemon and compiling Kotlin in-process avoids the loopback IPC; turning
# off Kotlin incremental compilation avoids the cache-corruption failure. Safe to
# remove on machines without the loopback proxy (daemons are faster there).
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
